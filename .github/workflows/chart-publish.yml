name: Helm Chart Lint & Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - 'charts/**'

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.16.1'

      - name: helm lint
        run: helm lint charts/wasabi-stats-exporter

      - name: helm template (dry render)
        run: |
          helm template charts/wasabi-stats-exporter \
            --set wasabiApiKeys.value=dummy=dummy
          helm template charts/wasabi-stats-exporter \
            --set wasabiApiKeys.value=dummy=dummy \
            --set serviceMonitor.enabled=true

  publish:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.16.1'

      - name: Set chart version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/wasabi-stats-exporter/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/wasabi-stats-exporter/Chart.yaml

      - name: helm package
        run: helm package charts/wasabi-stats-exporter -d /tmp/chart-out

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: helm push
        run: helm push /tmp/chart-out/wasabi-stats-exporter-*.tgz oci://ghcr.io/letsconvert-io/charts
