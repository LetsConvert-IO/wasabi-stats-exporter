# -- Number of replicas. The exporter polls Wasabi hourly and holds no state,
# so 1 is typical; running >1 just means duplicate scrapes/API calls.
replicaCount: 1

image:
  registry: ghcr.io
  repository: letsconvert-io/wasabi-stats-exporter
  # -- Defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop: ["ALL"]

# -- Standard expose toggle: creates a ClusterIP (or other) Service fronting the metrics port
service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: wasabi-stats-exporter.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

nodeSelector: {}
tolerations: []
affinity: {}

# The exporter has no HTTP health route today, so probes default to a TCP
# socket check against the metrics port rather than an HTTP GET.
livenessProbe:
  enabled: true
  tcpSocket:
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

# Wasabi Stats API credentials. There is no separate "Stats API key" concept
# in Wasabi -- authentication is the same access key/secret key pair used for
# S3 access (Root, or a sub-user with the WasabiAccountStatsAccess /
# WasabiBucketStatsAccess policies), colon-joined into AccessKeyID:SecretAccessKey
# per Wasabi's Stats API auth format.
wasabiApiKeys:
  # -- Preferred: list of Wasabi accounts to poll, each sourcing its access/secret
  # key pair from an existing Secret -- e.g. one already used for S3 access, no
  # need to create a separate credential. The chart composes the required
  # AccessKeyID:SecretAccessKey value in-container. `name` is only the
  # Prometheus account_name label used to tell accounts apart in metrics --
  # pick something readable (e.g. "prd"), not Wasabi's account ID.
  accounts: []
  # accounts:
  #   - name: letsconvert
  #     existingSecret: wasabi-secret
  #     accessKeyIdKey: AWS_ACCESS_KEY_ID       # defaults shown
  #     secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

  # -- Fallback: name of a pre-existing Secret that already contains a fully
  # composed WASABI_API_KEYS value (comma-separated
  # account_name=AccessKeyID:SecretAccessKey pairs). Ignored when `accounts` is set.
  existingSecret: ""
  existingSecretKey: "WASABI_API_KEYS"
  # -- Fallback: inline fully composed value, only used when both `accounts`
  # and `existingSecret` are empty. Rendered into a Secret this chart manages.
  # Avoid setting this directly in a HelmRelease `values:` block in git.
  value: ""

extraEnv: []
# extraEnv:
#   - name: LOG_LEVEL
#     value: "info"

metrics:
  port: 8080
  path: /metrics

# ServiceMonitor for Prometheus Operator scraping. Disabled by default --
# enable explicitly once the exporter is deployed into a namespace your
# kube-prometheus-stack is watching.
serviceMonitor:
  enabled: false
  # -- Defaults to the release namespace when empty
  namespace: ""
  interval: 1m
  scrapeTimeout: ""
  # -- Defaults to metrics.path when empty
  path: ""
  # -- Extra labels on the ServiceMonitor object itself. If your
  # kube-prometheus-stack's serviceMonitorSelector matches on labels (rather
  # than, or in addition to, namespace selection), set the label it expects
  # here, e.g. `release: kube-prometheus-stack`.
  labels: {}
  annotations: {}
  metricRelabelings: []
  relabelings: []
