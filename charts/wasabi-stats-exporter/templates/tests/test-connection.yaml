apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "wasabi-stats-exporter.fullname" . }}-test-connection"
  labels:
    {{- include "wasabi-stats-exporter.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "wasabi-stats-exporter.fullname" . }}:{{ .Values.service.port }}/{{ .Values.metrics.path | trimPrefix "/" }}']
  restartPolicy: Never
