{{- include "wasabi-stats-exporter.validateWasabiApiKeys" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wasabi-stats-exporter.fullname" . }}
  labels:
    {{- include "wasabi-stats-exporter.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wasabi-stats-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wasabi-stats-exporter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "wasabi-stats-exporter.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: wasabi-stats-exporter
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- if .Values.wasabiApiKeys.accounts }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              export WASABI_API_KEYS="{{ range $i, $a := .Values.wasabiApiKeys.accounts }}{{ if $i }},{{ end }}{{ $a.name }}=${WASABI_ACCOUNT_{{ $i }}_ACCESS_KEY}:${WASABI_ACCOUNT_{{ $i }}_SECRET_KEY}{{ end }}"
              exec ./wasabi_exporter
          env:
            {{- range $i, $a := .Values.wasabiApiKeys.accounts }}
            - name: WASABI_ACCOUNT_{{ $i }}_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $a.existingSecret }}
                  key: {{ $a.accessKeyIdKey | default "AWS_ACCESS_KEY_ID" }}
            - name: WASABI_ACCOUNT_{{ $i }}_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $a.existingSecret }}
                  key: {{ $a.secretAccessKeyKey | default "AWS_SECRET_ACCESS_KEY" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else }}
          env:
            - name: WASABI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "wasabi-stats-exporter.secretName" . }}
                  key: {{ include "wasabi-stats-exporter.secretKey" . }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
