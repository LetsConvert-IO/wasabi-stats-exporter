{{- include "wasabi-stats-exporter.validateWasabiApiKeys" . -}}
{{- if not .Values.wasabiApiKeys.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wasabi-stats-exporter.fullname" . }}
  labels:
    {{- include "wasabi-stats-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  WASABI_API_KEYS: {{ .Values.wasabiApiKeys.value | quote }}
{{- end }}
